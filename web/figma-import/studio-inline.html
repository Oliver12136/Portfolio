  <script>
    (function () {
      function readFigmaCaptureConfig() {
        var hash = window.location.hash || "";
        var clean = hash.charAt(0) === "#" ? hash.slice(1) : hash;
        if (!clean) return null;
        var params = new URLSearchParams(clean);
        var captureId = params.get("figmacapture");
        var endpoint = params.get("figmaendpoint");
        if (!captureId || !endpoint) return null;
        var selector = params.get("figmaselector") || "body";
        var delay = Number(params.get("figmadelay") || "0");
        return {
          captureId: captureId,
          endpoint: endpoint,
          selector: selector,
          delay: Number.isFinite(delay) ? Math.max(delay, 0) : 0
        };
      }

      function maybeRunFigmaCapture() {
        var config = readFigmaCaptureConfig();
        document.documentElement.classList.toggle("figma-capture-active", !!config);
        if (!config) return;
        if (window.__figmaAutoCaptureLastId === config.captureId) return;

        var attempts = 0;
        function tryCapture() {
          attempts += 1;
          if (window.figma && typeof window.figma.captureForDesign === "function") {
            window.__figmaAutoCaptureLastId = config.captureId;
            window.setTimeout(function () {
              window.figma.captureForDesign({
                captureId: config.captureId,
                endpoint: config.endpoint,
                selector: config.selector
              });
            }, config.delay);
            return;
          }
          if (attempts < 240) {
            window.setTimeout(tryCapture, 250);
          }
        }

        tryCapture();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", maybeRunFigmaCapture, { once: true });
      } else {
        maybeRunFigmaCapture();
      }
      window.addEventListener("hashchange", maybeRunFigmaCapture);
    })();
  </script>
